name: Watchkonomi
options:
  bundleIdPrefix: com.example.watchkonomi
  deploymentTarget:
    watchOS: "10.0"
    iOS: "16.0"
targets:
  Watchkonomi:
    type: application
    platform: watchOS
    sources: [Watchkonomi]
    info:
      path: Watchkonomi/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.example.watchkonomi
        CFBundleDisplayName: Watchkonomi
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.watchkonomi.watch
        SWIFT_VERSION: "5.0"
  WatchkonomiCompanion:
    type: application
    platform: iOS
    sources: [Companion]
    dependencies:
      - target: Watchkonomi
    info:
      path: Companion/Info.plist
      properties:
        CFBundleDisplayName: Watchkonomi
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.watchkonomi
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
  WatchkonomiTests:
    type: bundle.unit-test
    platform: watchOS
    sources: [Tests]
    dependencies:
      - target: Watchkonomi
schemes:
  Watchkonomi:
    build:
      targets: { Watchkonomi: all }
    test:
      targets: [WatchkonomiTests]
  WatchkonomiCompanion:
    build:
      targets: { WatchkonomiCompanion: all }
