name: Build

on:
  push:
  pull_request:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
        working-directory: v2
      - name: List available simulators
        run: xcrun simctl list devices available
      - name: Run unit tests
        working-directory: v2
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries[] | select(.key | contains("watchOS")) | .value[] | select(.isAvailable) | .udid' | head -n 1)
          echo "Using simulator UDID: $UDID"
          xcodebuild test -project Watchkonomi.xcodeproj -scheme Watchkonomi \
            -destination "platform=watchOS Simulator,id=$UDID" CODE_SIGNING_ALLOWED=NO > xctest.log 2>&1 || rc=$?
          rc=${rc:-0}
          tail -n 60 xctest.log
          if [ $rc -ne 0 ]; then
            echo "=== compiler errors ==="
            grep -E "error:" xctest.log | head -n 80 || true
            exit 1
          fi
      - name: Build watch app for device (unsigned)
        working-directory: v2
        run: |
          xcodebuild build -project Watchkonomi.xcodeproj -scheme Watchkonomi \
          -configuration Release -destination 'generic/platform=watchOS' CODE_SIGNING_ALLOWED=NO > xcbuild.log 2>&1 || rc=$?
          rc=${rc:-0}
          tail -n 30 xcbuild.log
          if [ $rc -ne 0 ]; then
            echo "=== compiler errors ==="
            grep -E "error:" xcbuild.log | head -n 80 || true
            exit 1
          fi
      - name: Package watch IPA
        run: |
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path "*Release-watchos/Watchkonomi.app" | head -n 1)
          mkdir -p ipa-watch/Payload && cp -R "$APP" ipa-watch/Payload/
          (cd ipa-watch && zip -qr ../Watchkonomi-watch.ipa Payload)
      - name: Build companion app for device (unsigned)
        working-directory: v2
        run: |
          xcodebuild build -project Watchkonomi.xcodeproj -scheme WatchkonomiCompanion \
          -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO > xcbuild-ios.log 2>&1 || rc=$?
          rc=${rc:-0}
          tail -n 30 xcbuild-ios.log
          if [ $rc -ne 0 ]; then
            echo "=== compiler errors ==="
            grep -E "error:" xcbuild-ios.log | head -n 80 || true
            exit 1
          fi
      - name: Package companion IPA
        run: |
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path "*Release-iphoneos/Watchkonomi.app" | head -n 1)
          mkdir -p ipa/Payload && cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qr ../Watchkonomi.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: ipas
          path: |
            Watchkonomi.ipa
            Watchkonomi-watch.ipa
